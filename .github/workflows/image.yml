name: Image
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image, no push
        run: docker build -f image/Dockerfile -t buzz-remote-agents:ci .
      - name: Check the server and hooks parse
        run: node --check server/server.js && node --check deploy/hooks.example.js
